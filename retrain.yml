name: Retrain - Model Update Pipeline

on:
  schedule:
    # Weekly retraining on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '5'
      batch_size:
        description: 'Batch size for training'
        required: false
        default: '64'

env:
  MODELS_ARTIFACT_NAME: trained-models
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}/cats-dogs-inference

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      checks: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.3.1 torchvision==0.18.1
          pip install -r requirements.txt

      - name: Cache DVC data
        uses: iterative/setup-dvc@v1

      - name: Pull training data
        run: |
          dvc pull data/ || echo "DVC pull failed - using sample data"
          python scripts/prepare_fast_dataset.py || echo "Using existing preprocessed data"

      - name: Train SimpleCNN model
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import torch.optim as optim
          from torch.utils.data import DataLoader
          from torchvision import transforms
          from torchvision.datasets import ImageFolder
          from src.model import SimpleCNN
          from tqdm import tqdm
          
          device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
          print(f'Training on: {device}')
          
          # Transforms
          train_transform = transforms.Compose([
              transforms.RandomHorizontalFlip(),
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          val_transform = transforms.Compose([
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          
          # Load data
          train_ds = ImageFolder('data/processed_fast/train', transform=train_transform)
          val_ds = ImageFolder('data/processed_fast/val', transform=val_transform)
          
          train_loader = DataLoader(train_ds, batch_size=64, shuffle=True, num_workers=4)
          val_loader = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=4)
          
          print(f'Train: {len(train_ds)}, Val: {len(val_ds)}')
          
          # Train model
          model = SimpleCNN(num_classes=2).to(device)
          criterion = nn.CrossEntropyLoss()
          optimizer = optim.Adam(model.parameters(), lr=0.001)
          
          best_val_acc = 0
          for epoch in range(3):
              model.train()
              for images, labels in tqdm(train_loader, desc=f'Epoch {epoch+1}/3'):
                  images, labels = images.to(device), labels.to(device)
                  optimizer.zero_grad()
                  outputs = model(images)
                  loss = criterion(outputs, labels)
                  loss.backward()
                  optimizer.step()
              
              # Validate
              model.eval()
              correct = 0
              total = 0
              with torch.no_grad():
                  for images, labels in val_loader:
                      images, labels = images.to(device), labels.to(device)
                      outputs = model(images)
                      _, predicted = torch.max(outputs, 1)
                      correct += (predicted == labels).sum().item()
                      total += labels.size(0)
              
              val_acc = 100 * correct / total
              print(f'Epoch {epoch+1}: Val Acc = {val_acc:.2f}%')
              
              if val_acc > best_val_acc:
                  best_val_acc = val_acc
                  checkpoint = {
                      'state_dict': model.state_dict(),
                      'classes': ['cat', 'dog'],
                      'accuracy': val_acc
                  }
                  torch.save(checkpoint, 'models/simplecnn_best.pt')
          
          print(f'Final SimpleCNN Accuracy: {best_val_acc:.2f}%')
          "

      - name: Train ResNet50 model
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import torch.optim as optim
          from torch.utils.data import DataLoader
          from torchvision import transforms, models
          from torchvision.datasets import ImageFolder
          from tqdm import tqdm
          
          device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
          
          # Transforms
          train_transform = transforms.Compose([
              transforms.RandomHorizontalFlip(),
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          val_transform = transforms.Compose([
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          
          # Load data
          train_ds = ImageFolder('data/processed_fast/train', transform=train_transform)
          val_ds = ImageFolder('data/processed_fast/val', transform=val_transform)
          
          train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)
          val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)
          
          # Train model
          model = models.resnet50(weights=models.ResNet50_Weights.IMAGENET1K_V2).to(device)
          model.fc = nn.Linear(model.fc.in_features, 2)
          
          criterion = nn.CrossEntropyLoss()
          optimizer = optim.Adam(model.parameters(), lr=0.0001)
          
          best_val_acc = 0
          for epoch in range(3):
              model.train()
              for images, labels in tqdm(train_loader, desc=f'ResNet50 Epoch {epoch+1}/3'):
                  images, labels = images.to(device), labels.to(device)
                  optimizer.zero_grad()
                  outputs = model(images)
                  loss = criterion(outputs, labels)
                  loss.backward()
                  optimizer.step()
              
              # Validate
              model.eval()
              correct = 0
              total = 0
              with torch.no_grad():
                  for images, labels in val_loader:
                      images, labels = images.to(device), labels.to(device)
                      outputs = model(images)
                      _, predicted = torch.max(outputs, 1)
                      correct += (predicted == labels).sum().item()
                      total += labels.size(0)
              
              val_acc = 100 * correct / total
              print(f'Epoch {epoch+1}: Val Acc = {val_acc:.2f}%')
              
              if val_acc > best_val_acc:
                  best_val_acc = val_acc
                  checkpoint = {
                      'state_dict': model.state_dict(),
                      'classes': ['cat', 'dog'],
                      'accuracy': val_acc
                  }
                  torch.save(checkpoint, 'models/resnet50_best.pt')
          
          print(f'Final ResNet50 Accuracy: {best_val_acc:.2f}%')
          "

      - name: Run model validation tests
        run: pytest tests/test_model_validation.py -v --junitxml=validation-results.xml

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-results
          path: validation-results.xml

      - name: Check model performance metrics
        run: |
          python -c "
          import torch
          from src.model import SimpleCNN
          from torchvision import models
          
          # Load and check models exist
          try:
              cnn = torch.load('models/simplecnn_best.pt')
              print(f'SimpleCNN loaded - Accuracy: {cnn[\"accuracy\"]:.2f}%')
          except Exception as e:
              print(f'Error loading SimpleCNN: {e}')
              exit(1)
          
          try:
              rn50 = torch.load('models/resnet50_best.pt')
              print(f'ResNet50 loaded - Accuracy: {rn50[\"accuracy\"]:.2f}%')
          except Exception as e:
              print(f'Error loading ResNet50: {e}')
              exit(1)
          "

      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODELS_ARTIFACT_NAME }}
          path: models/*.pt
          retention-days: 30

      - name: Commit updated models
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add models/simplecnn_best.pt models/resnet50_best.pt
          git commit -m "chore: update trained models from automated retraining" || echo "No model changes"
          git push origin main || echo "Push failed - may have no changes"

      - name: Create release with models
        if: github.event_name == 'schedule'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: model-${{ github.run_id }}
          release_name: Automated Model Update - ${{ github.run_id }}
          body: |
            Automated model retraining completed.
            - SimpleCNN trained on PetImages dataset
            - ResNet50 fine-tuned on PetImages dataset
            Models available in artifacts.
          draft: false
          prerelease: false

  trigger-deployment:
    needs: retrain
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger CD workflow
        run: |
          echo "Models trained successfully. Triggering deployment..."
          # The CI workflow will be triggered by the new models being pushed
