name: Push to Docker Registry

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app/**'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      registry:
        description: 'Docker registry (docker-io or ghcr-io)'
        required: true
        default: 'ghcr-io'
        type: choice
        options:
          - docker-io
          - ghcr-io

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_IO_REGISTRY: docker.io

jobs:
  push-to-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SimpleCNN image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-simplecnn:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-simplecnn:${{ github.sha }}
          build-args: |
            MODEL_TYPE=simplecnn
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-simplecnn:latest
          cache-to: type=inline

      - name: Build and push ResNet50 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-resnet50:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-resnet50:${{ github.sha }}
          build-args: |
            MODEL_TYPE=resnet50
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-resnet50:latest
          cache-to: type=inline

      - name: Create image manifest
        run: |
          cat > image-manifest.json <<EOF
          {
            "simplecnn": "${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-simplecnn:${{ github.sha }}",
            "resnet50": "${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-resnet50:${{ github.sha }}",
            "build_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}"
          }
          EOF
          cat image-manifest.json

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-manifest.json

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Verify pushed images
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-simplecnn:${{ github.sha }}
          docker pull ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/cats-dogs-resnet50:${{ github.sha }}
          echo "Images successfully pushed and verified"
